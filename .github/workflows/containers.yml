name: Containers (build, scan, push, deploy)

# Builds the app into two container formats (Docker/OCI and Apptainer/Singularity),
# scans the Docker image for vulnerabilities, pushes to Docker Hub + GHCR,
# and copies the built image to an upstream server over SSH.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME   Docker Hub username
#   DOCKERHUB_TOKEN      Docker Hub access token (not your password)
#   DEPLOY_HOST          Hostname/IP of the upstream server
#   DEPLOY_USER           SSH user on the upstream server
#   DEPLOY_SSH_KEY        Private key with access to DEPLOY_USER@DEPLOY_HOST
#   DEPLOY_PORT           (optional) SSH port, defaults to 22
#
# GITHUB_TOKEN (auto-provided) is used to push to ghcr.io.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

env:
  IMAGE_NAME: py-cicd-demo
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/py-cicd-demo
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/py-cicd-demo

permissions:
  contents: read
  packages: write        # push to GHCR
  security-events: write # upload Trivy SARIF to the Security tab

jobs:
  # ---------------------------------------------------------------------
  # 1) Re-run the unit tests as a gate before we spend time building images
  # ---------------------------------------------------------------------
  test:
    name: Test before build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # ---------------------------------------------------------------------
  # 2) Build the Docker image, scan it, push it (build-only on PRs)
  # ---------------------------------------------------------------------
  docker:
    name: Build & scan Docker image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
      image_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      # Build once, load into the local docker daemon so Trivy can scan it,
      # then (on push/tag events only) push the same tags to both registries.
      #
      # NOTE: `latest` is only ever tagged on pushes to the default branch
      # (see `type=raw,value=latest,enable={{is_default_branch}}` above), so
      # it does NOT exist on a tag push. Every step below that needs a
      # locally-loaded reference uses the branch/trigger-independent
      # `:ci-scan` tag instead of hardcoding `:latest`.
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.GHCR_IMAGE }}:ci-scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (vulnerability report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}:ci-scan
          format: "table"
          output: "trivy-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0" # don't fail the build; report only (flip to "1" to gate on findings)

      - name: Generate SARIF report for GitHub Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}:ci-scan
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: false

      - name: Upload vulnerability report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: |
            trivy-report.txt
            trivy-results.sarif
          retention-days: 30

      - name: Push image to Docker Hub & GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tar (for the SSH deploy job)
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${{ env.GHCR_IMAGE }}:ci-scan" "${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}"
          docker save "${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}" -o py-cicd-demo.tar

      - name: Upload image tar artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: py-cicd-demo.tar
          retention-days: 7

  # ---------------------------------------------------------------------
  # 3) Build an Apptainer/Singularity .sif image from the same source
  # ---------------------------------------------------------------------
  apptainer:
    name: Build Apptainer (.sif) image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: "1.3.4"

      - name: Build .sif from apptainer.def
        run: |
          sudo apptainer build py-cicd-demo.sif apptainer.def

      - name: Smoke-test the .sif image
        run: |
          apptainer run py-cicd-demo.sif CI-Apptainer
          apptainer test py-cicd-demo.sif

      - name: Upload .sif artifact
        uses: actions/upload-artifact@v4
        with:
          name: apptainer-sif
          path: py-cicd-demo.sif
          retention-days: 7

      # Apptainer images can also be pushed as OCI artifacts to any
      # OCI-compliant registry (GHCR supports this natively).
      - name: Log in to GHCR (oras push)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Push .sif to GHCR as an OCI artifact
        if: github.event_name != 'pull_request'
        run: |
          apptainer push py-cicd-demo.sif \
            oras://ghcr.io/${{ github.repository_owner }}/py-cicd-demo-sif:latest

