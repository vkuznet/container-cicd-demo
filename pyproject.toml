[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-cicd-demo"
version = "0.1.0"
description = "A minimal hello-world Python app used to demonstrate a full CI/CD + container pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["demo", "ci-cd", "docker", "apptainer", "singularity", "github-actions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "flake8>=7.0"]

[project.scripts]
py-cicd-demo = "hello:main"

[project.urls]
Homepage = "https://github.com/vkuznet/py-cicd-demo"
Issues = "https://github.com/vkuznet/py-cicd-demo/issues"

[tool.setuptools]
py-modules = ["hello"]
